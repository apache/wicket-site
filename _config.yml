name: Apache Wicket
url: https://wicket.apache.org
description: Apache Wicket is a component-oriented Java web framework for complex, dynamic pages in plain Java and plain HTML, without a JavaScript build chain.
destination: ./content
lsi:         false
port: 4000
highlighter:    rouge
markdown:    Kramdown
monthly_archive:
    path:   news
    layout: blog-archive
yearly_archive:
    layout: blog-archive
permalink:   news/:year/:month/:day/:title.html
exclude:      [readme.md, PRODUCT.md, DESIGN.md, GUIDE.md, .impeccable, .previews]
excerpt_separator: <!--more-->
contentsLabel: On this page

# The user guide: one page per file in _guide/, see GUIDE.md. Topic pages and
# the search index are generated by _plugins/guide.rb.
collections:
  guide:
    output: true
    permalink: /docs/:name.html
  # The contributor documentation: one page per file in _contribute/, by kind like the
  # user guide, listed on contribute/index.md.
  contribute:
    output: true
    permalink: /contribute/:name.html

defaults:
  - scope:
      type: guide
    values:
      layout: guide
      active_link: documentation
  - scope:
      type: contribute
    values:
      layout: contribute
      active_link: community
  - scope:
      type: posts
    values:
      active_link: blog
  - scope:
      path: versions
    values:
      active_link: versions
  - scope:
      path: contribute
    values:
      active_link: community
sass:
    sass_dir: _sass
wicket:
  version:    10.11.0
  version_90: 9.24.0
  version_10: 10.11.0
  version_80: 8.19.0
  version_70: 7.18.0
  version_60: 6.30.0
  version_15: 1.5.16
  version_14: 1.4.23
  version_13: 1.3.7
  released:   2026-08-5
  versions:   [6.30.0, 1.5.16, 1.4.23, 7.18.0, 8.19.0, 9.24.0, 10.11.0, 9.25.0-SNAPSHOT, 10.12.0-SNAPSHOT]

live_examples_url: http://examples10x.wicket.apache.org/

navigation:
- id: documentation
  text: Docs
  url: /docs/
- id: blog
  text: Blog
  url: /news/
  layout: blog-archive
- id: community
  text: Community
  url: /community/

